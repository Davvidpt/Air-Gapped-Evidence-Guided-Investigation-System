[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-offline"
version = "0.2.0"
description = "AEGIS: Air-Gapped Evidence & Guided Investigation System"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
